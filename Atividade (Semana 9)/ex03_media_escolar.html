<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exercício 03 – Média Escolar</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0c10;
      --surface: #13141a;
      --border: #222430;
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --text: #e8e8f0;
      --muted: #6b6d80;
      --aprovado: #3b82f6;
      --exame: #22c55e;
      --reprovado: #ef4444;
      --radius: 12px;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% -10%, rgba(201,168,76,.10), transparent);
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
      animation: fadeUp .5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: .7rem;
      letter-spacing: .1em;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 2px 8px;
      margin-bottom: 1rem;
    }

    h1 { font-size: 1.8rem; font-weight: 800; line-height: 1.15; margin-bottom: .5rem; }
    h1 span { color: var(--gold); }
    p.sub { color: var(--muted); font-size: .9rem; margin-bottom: 2rem; }

    .form-group { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-size: .75rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .45rem;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      padding: .8rem 1rem;
      outline: none;
      transition: border-color .2s;
      -moz-appearance: textfield;
    }

    input::-webkit-inner-spin-button,
    input::-webkit-outer-spin-button { -webkit-appearance: none; }

    input:focus { border-color: var(--gold); }

    .notas { display: flex; gap: .8rem; }
    .notas .form-group { flex: 1; }

    button {
      width: 100%;
      background: var(--gold);
      color: #0b0c10;
      border: none;
      border-radius: var(--radius);
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .04em;
      padding: .9rem;
      cursor: pointer;
      margin-top: .5rem;
      transition: background .2s, transform .1s;
    }

    button:hover  { background: var(--gold-light); }
    button:active { transform: scale(.98); }

    .result {
      display: none;
      margin-top: 1.5rem;
      border-radius: var(--radius);
      padding: 1.25rem;
      animation: fadeUp .3s ease;
    }

    .result.show { display: block; }

    .result .aluno-nome { font-size: .8rem; color: var(--muted); margin-bottom: .25rem; letter-spacing:.05em; text-transform:uppercase; }
    .result .media-val { font-family: 'DM Mono', monospace; font-size: 2.5rem; font-weight: 700; line-height: 1; margin-bottom: .4rem; }
    .result .situacao  { font-size: 1rem; font-weight: 700; }
    .result .extra     { font-size: .85rem; margin-top: .4rem; opacity: .85; }

    .aprovado  { background: rgba(59,130,246,.1);  border: 1px solid var(--aprovado);  color: var(--aprovado); }
    .exame     { background: rgba(34,197,94,.1);   border: 1px solid var(--exame);     color: var(--exame); }
    .reprovado { background: rgba(239,68,68,.1);   border: 1px solid var(--reprovado); color: var(--reprovado); }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">EX 03</span>
    <h1>Média <span>Escolar</span></h1>
    <p class="sub">Informe os dados do aluno para calcular a situação final.</p>

    <div class="form-group">
      <label>Nome do aluno</label>
      <input type="text" id="nome" placeholder="Ex: João da Silva"/>
    </div>

    <div class="notas">
      <div class="form-group">
        <label>Nota 1</label>
        <input type="number" id="n1" placeholder="0.0" min="0" max="10" step="0.1"/>
      </div>
      <div class="form-group">
        <label>Nota 2</label>
        <input type="number" id="n2" placeholder="0.0" min="0" max="10" step="0.1"/>
      </div>
      <div class="form-group">
        <label>Nota 3</label>
        <input type="number" id="n3" placeholder="0.0" min="0" max="10" step="0.1"/>
      </div>
    </div>

    <button onclick="calcular()">Calcular Situação</button>

    <div class="result" id="resultado">
      <div class="aluno-nome" id="res-nome"></div>
      <div class="media-val" id="res-media"></div>
      <div class="situacao" id="res-sit"></div>
      <div class="extra" id="res-extra"></div>
    </div>
  </div>

  <script>
    function calcular() {
      const nome = document.getElementById('nome').value.trim() || 'Aluno';
      const n1 = Number(document.getElementById('n1').value);
      const n2 = Number(document.getElementById('n2').value);
      const n3 = Number(document.getElementById('n3').value);
      const media = (n1 + n2 + n3) / 3;

      const res   = document.getElementById('resultado');
      const rNome = document.getElementById('res-nome');
      const rMed  = document.getElementById('res-media');
      const rSit  = document.getElementById('res-sit');
      const rExt  = document.getElementById('res-extra');

      rNome.textContent = nome;
      rMed.textContent  = media.toFixed(2);

      res.className = 'result show';

      if (media >= 7) {
        res.classList.add('aprovado');
        rSit.textContent = '✔ Aprovado';
        rExt.textContent = '';
      } else if (media >= 4) {
        res.classList.add('exame');
        const falta = (10 - media).toFixed(2);
        rSit.textContent = '⚠ Em Exame';
        rExt.textContent = `Faltam ${falta} pontos para atingir a nota máxima.`;
      } else {
        res.classList.add('reprovado');
        rSit.textContent = '✘ Reprovado';
        rExt.textContent = 'Média abaixo do mínimo exigido.';
      }
    }
  </script>
</body>
</html>
