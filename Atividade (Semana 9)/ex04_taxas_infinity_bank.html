<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exercício 04 – Taxas Infinity Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0c10;
      --surface: #13141a;
      --surface2: #1a1b22;
      --border: #222430;
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --text: #e8e8f0;
      --muted: #6b6d80;
      --radius: 12px;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% -10%, rgba(201,168,76,.10), transparent);
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
      animation: fadeUp .5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2rem; }
    .logo { font-size: .75rem; font-family: 'DM Mono', monospace; color: var(--gold); letter-spacing: .12em; }

    .badge {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: .7rem;
      letter-spacing: .1em;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 2px 8px;
      margin-bottom: 1rem;
    }

    h1 { font-size: 1.7rem; font-weight: 800; line-height: 1.15; margin-bottom: .5rem; }
    h1 span { color: var(--gold); }
    p.sub { color: var(--muted); font-size: .88rem; margin-bottom: 2rem; }

    .form-group { margin-bottom: 1.2rem; }

    label {
      display: block;
      font-size: .75rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .45rem;
    }

    select, input[type="number"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      padding: .8rem 1rem;
      outline: none;
      transition: border-color .2s;
      -moz-appearance: textfield;
      appearance: none;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    select:focus, input:focus { border-color: var(--gold); }

    .row { display: flex; gap: .8rem; }
    .row .form-group { flex: 1; }

    button {
      width: 100%;
      background: var(--gold);
      color: #0b0c10;
      border: none;
      border-radius: var(--radius);
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .04em;
      padding: .9rem;
      cursor: pointer;
      margin-top: .5rem;
      transition: background .2s, transform .1s;
    }

    button:hover  { background: var(--gold-light); }
    button:active { transform: scale(.98); }

    .resumo {
      display: none;
      margin-top: 1.8rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: fadeUp .3s ease;
    }

    .resumo.show { display: block; }

    .resumo-titulo {
      background: var(--bg);
      padding: .7rem 1.2rem;
      font-size: .7rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .resumo-linha {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .75rem 1.2rem;
      border-bottom: 1px solid var(--border);
      font-size: .92rem;
    }

    .resumo-linha:last-child { border-bottom: none; }
    .resumo-linha .chave  { color: var(--muted); }
    .resumo-linha .valor  { font-family: 'DM Mono', monospace; color: var(--text); }

    .resumo-linha.destaque .chave  { color: var(--text); font-weight: 700; }
    .resumo-linha.destaque .valor  { color: var(--gold); font-size: 1.15rem; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">EX 04</span>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
      <h1>Simulador <span>Infinity Bank</span></h1>
      <span style="font-family:'DM Mono',monospace; font-size:.72rem; color:var(--gold); opacity:.7">INFINITY BANK</span>
    </div>
    <p class="sub">Calcule taxas de bandeira, juros e o valor total parcelado.</p>

    <div class="form-group">
      <label>Bandeira do Cartão</label>
      <select id="bandeira">
        <option value="visa">Visa — 2,00%</option>
        <option value="master">Mastercard — 1,85%</option>
        <option value="elo">Elo — 3,00%</option>
      </select>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Valor da Venda (R$)</label>
        <input type="number" id="valor" placeholder="0,00" min="0" step="0.01"/>
      </div>
      <div class="form-group">
        <label>Parcelas</label>
        <input type="number" id="parcelas" placeholder="1" min="1" max="24" step="1" value="1"/>
      </div>
    </div>

    <button onclick="calcular()">Simular Venda</button>

    <div class="resumo" id="resumo">
      <div class="resumo-titulo">Resumo da Operação</div>
      <div class="resumo-linha">
        <span class="chave">Valor da Venda</span>
        <span class="valor" id="r-venda">—</span>
      </div>
      <div class="resumo-linha">
        <span class="chave">Taxa da Bandeira</span>
        <span class="valor" id="r-taxa">—</span>
      </div>
      <div class="resumo-linha">
        <span class="chave">Juros (0,35% × parcelas)</span>
        <span class="valor" id="r-juros">—</span>
      </div>
      <div class="resumo-linha">
        <span class="chave">Taxa Mensal (R$ 12,50 × parcelas)</span>
        <span class="valor" id="r-mensal">—</span>
      </div>
      <div class="resumo-linha">
        <span class="chave">Valor Total</span>
        <span class="valor" id="r-total">—</span>
      </div>
      <div class="resumo-linha destaque">
        <span class="chave">Valor por Parcela</span>
        <span class="valor" id="r-parcela">—</span>
      </div>
    </div>
  </div>

  <script>
    function fmt(v) {
      return 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function calcular() {
      const venda    = parseFloat(document.getElementById('valor').value) || 0;
      const parcelas = parseInt(document.getElementById('parcelas').value) || 1;
      const bandeira = document.getElementById('bandeira').value;

      let taxaBandPerc;
      switch (bandeira) {
        case 'visa':   taxaBandPerc = 0.02;   break;
        case 'master': taxaBandPerc = 0.0185; break;
        case 'elo':    taxaBandPerc = 0.03;   break;
      }

      const taxaBand   = venda * taxaBandPerc;
      const jurosTotais = venda * (0.0035 * parcelas);
      const taxaMensal  = 12.50 * parcelas;
      const total       = venda + taxaBand + jurosTotais + taxaMensal;
      const porParcela  = total / parcelas;

      document.getElementById('r-venda').textContent   = fmt(venda);
      document.getElementById('r-taxa').textContent    = fmt(taxaBand);
      document.getElementById('r-juros').textContent   = fmt(jurosTotais);
      document.getElementById('r-mensal').textContent  = fmt(taxaMensal);
      document.getElementById('r-total').textContent   = fmt(total);
      document.getElementById('r-parcela').textContent = `${parcelas}x ${fmt(porParcela)}`;

      document.getElementById('resumo').classList.add('show');
    }
  </script>
</body>
</html>
