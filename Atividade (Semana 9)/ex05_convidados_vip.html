<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exercício 05 – Convidados VIP</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0c10;
      --surface: #13141a;
      --surface2: #1a1b22;
      --border: #222430;
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --text: #e8e8f0;
      --muted: #6b6d80;
      --success: #22c55e;
      --danger: #ef4444;
      --warn: #f59e0b;
      --radius: 12px;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% -10%, rgba(201,168,76,.10), transparent);
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
      animation: fadeUp .5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: .7rem;
      letter-spacing: .1em;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 2px 8px;
      margin-bottom: 1rem;
    }

    h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: .4rem; }
    h1 span { color: var(--gold); }
    p.sub { color: var(--muted); font-size: .88rem; margin-bottom: 1.8rem; }

    .add-row {
      display: flex;
      gap: .7rem;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      padding: .75rem 1rem;
      outline: none;
      transition: border-color .2s;
    }

    input[type="text"]:focus { border-color: var(--gold); }

    .btn-add {
      background: var(--gold);
      color: #0b0c10;
      border: none;
      border-radius: var(--radius);
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      padding: .75rem 1.3rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s, transform .1s;
    }

    .btn-add:hover  { background: var(--gold-light); }
    .btn-add:active { transform: scale(.97); }

    .stats {
      display: flex;
      gap: .6rem;
      margin-bottom: 1.2rem;
    }

    .stat {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .6rem .9rem;
      text-align: center;
    }

    .stat .n { font-family: 'DM Mono', monospace; font-size: 1.3rem; font-weight: 700; color: var(--gold); }
    .stat .l { font-size: .68rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }

    .lista {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .lista::-webkit-scrollbar { width: 4px; }
    .lista::-webkit-scrollbar-track { background: transparent; }
    .lista::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .9rem 1rem;
      display: flex;
      align-items: center;
      gap: .8rem;
      transition: opacity .2s;
      animation: fadeUp .25s ease;
    }

    .item.chegou { opacity: .55; }
    .item.chegou .nome { text-decoration: line-through; color: var(--muted); }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .85rem;
      font-weight: 700;
      color: var(--gold);
      flex-shrink: 0;
    }

    .nome {
      flex: 1;
      font-size: .97rem;
      font-weight: 600;
      transition: color .2s;
    }

    .acoes {
      display: flex;
      gap: .35rem;
      flex-shrink: 0;
    }

    .btn-acao {
      border: none;
      border-radius: 6px;
      font-family: 'Syne', sans-serif;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .04em;
      padding: .35rem .65rem;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }

    .btn-acao:active { transform: scale(.95); }

    .btn-ok  { background: rgba(34,197,94,.15);  color: var(--success); }
    .btn-ed  { background: rgba(245,158,11,.15); color: var(--warn); }
    .btn-del { background: rgba(239,68,68,.15);  color: var(--danger); }

    .btn-ok:hover  { background: rgba(34,197,94,.3); }
    .btn-ed:hover  { background: rgba(245,158,11,.3); }
    .btn-del:hover { background: rgba(239,68,68,.3); }

    .vazio {
      text-align: center;
      padding: 2.5rem 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .vazio .icon { font-size: 2rem; display: block; margin-bottom: .5rem; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">EX 05</span>
    <h1>Convidados <span>VIP</span></h1>
    <p class="sub">Infinity Bank — Lista de convidados para o evento de inauguração.</p>

    <div class="add-row">
      <input type="text" id="nome-input" placeholder="Nome do convidado…"/>
      <button class="btn-add" onclick="adicionar()">+ Adicionar</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="n" id="st-total">0</div><div class="l">Total</div></div>
      <div class="stat"><div class="n" id="st-chegou">0</div><div class="l">Chegaram</div></div>
      <div class="stat"><div class="n" id="st-aguard">0</div><div class="l">Aguardando</div></div>
    </div>

    <ul class="lista" id="lista"></ul>
  </div>

  <script>
    const lista = [];

    document.getElementById('nome-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') adicionar();
    });

    function adicionar() {
      const inp = document.getElementById('nome-input');
      const nome = inp.value.trim();
      if (!nome) return;
      lista.push({ id: Date.now(), nome, chegou: false });
      inp.value = '';
      render();
    }

    function concluir(id) {
      const item = lista.find(i => i.id === id);
      if (item) item.chegou = !item.chegou;
      render();
    }

    function editar(id) {
      const item = lista.find(i => i.id === id);
      if (!item) return;
      const novo = prompt('Novo nome:', item.nome);
      if (novo && novo.trim()) { item.nome = novo.trim(); render(); }
    }

    function excluir(id) {
      const idx = lista.findIndex(i => i.id === id);
      if (idx !== -1) { lista.splice(idx, 1); render(); }
    }

    function render() {
      const ul = document.getElementById('lista');
      ul.innerHTML = '';

      if (lista.length === 0) {
        ul.innerHTML = '<li class="vazio"><span class="icon">🎉</span>Nenhum convidado adicionado ainda.</li>';
      } else {
        lista.forEach(item => {
          const li = document.createElement('li');
          li.className = 'item' + (item.chegou ? ' chegou' : '');
          li.innerHTML = `
            <div class="avatar">${item.nome[0].toUpperCase()}</div>
            <span class="nome">${item.nome}</span>
            <div class="acoes">
              <button class="btn-acao btn-ok"  onclick="concluir(${item.id})">${item.chegou ? 'Desfazer' : 'Chegou'}</button>
              <button class="btn-acao btn-ed"  onclick="editar(${item.id})">Editar</button>
              <button class="btn-acao btn-del" onclick="excluir(${item.id})">Excluir</button>
            </div>`;
          ul.appendChild(li);
        });
      }

      const chegaram = lista.filter(i => i.chegou).length;
      document.getElementById('st-total').textContent  = lista.length;
      document.getElementById('st-chegou').textContent = chegaram;
      document.getElementById('st-aguard').textContent = lista.length - chegaram;
    }

    render();
  </script>
</body>
</html>
